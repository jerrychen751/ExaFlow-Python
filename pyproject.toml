[project]
name = "exaflow"
version = "0.1.0"
description = "A Python solver for the incompressible Navier-Stokes equations in 1D, 2D, and 3D with MPI parallelization."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "mpi4py",
    "openmpi; sys_platform != 'win32'",
    "scipy",
    "pyside6",
    "pyvista",
    "pyvistaqt",
    "vtk",
    "Pillow",
    "mypy",
    "pytest",
    "pyside6-stubs",
    "scipy-stubs",
    "pyinstaller",
    "ipykernel",
    "pybind11>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "mpi: launches mpiexec, and is skipped when no launcher is on PATH",
    "gui: imports the visualization stack (vtk, pyvista, PySide6) and needs no display",
    "slow: runs a subprocess or marches enough steps to take about a second",
]

[project.scripts]
exaflow = "exaflow.cli:main"

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
wheel.packages = ["src/exaflow"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/cpp/stubs"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/CMakeLists.txt" },
    { file = "cpp/**/*.cpp" },
    { file = "cpp/**/*.hpp" },
    { file = "cpp/**/*.pyi" },
]
