[project]
name = "exaflow"
version = "0.1.0"
description = "A Python solver for the incompressible Navier-Stokes equations in 1D, 2D, and 3D with MPI parallelization."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "mpi4py",
    "openmpi; sys_platform != 'win32'",
    "scipy",
    "pyevtk",
    "pyside6",
    "pyvista",
    "pyvistaqt",
    "vtk",
    "Pillow",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pyside6-stubs",
    "scipy-stubs",
    "pyinstaller",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "mpi: launches mpiexec, and is skipped when no launcher is on PATH",
    "gui: imports the visualization stack (vtk, pyvista, PySide6) and needs no display",
    "slow: runs a subprocess or marches enough steps to take about a second",
]

[project.scripts]
exaflow = "exaflow.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exaflow = ["py.typed", "gui/presets/*.xml"]
